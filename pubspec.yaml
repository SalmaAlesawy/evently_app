name: eventapp
description: "A new Flutter project."

publish_to: 'none'


version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  cupertino_icons: ^1.0.8
  #flutter_native_splash: ^2.4.4
  flutter_svg: ^2.1.0
  smooth_page_indicator: ^2.0.1

  vector_graphics: any
  provider: ^6.1.5+1
  firebase_core: ^4.4.0
  cloud_firestore: ^6.1.2
  firebase_auth: ^6.1.4
  flutter_easyloading: ^3.0.5
  toastification: ^3.0.3
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  build_runner:
  flutter_gen_runner:


flutter:

  uses-material-design: true

  generate: true

  assets:
     - assets/images/
     - assets/icons/


  # example:
  fonts:
     - family: Poppins
       fonts:
         - asset: assets/fonts/Poppins-Regular.ttf
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

flutter_gen:
  output: lib/core/gen/


  integrations:
    image: true
    flutter_svg: true
